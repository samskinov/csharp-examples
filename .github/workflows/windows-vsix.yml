name: Build and smoke test Windows VSIX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "0*-continue-*.patch"
      - "continue-vsix-build.md"
      - ".github/workflows/windows-vsix.yml"

jobs:
  windows-vsix:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"

      - name: Clone Continue and apply patches
        shell: pwsh
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Continue CI"
          git clone --filter=blob:none https://github.com/continuedev/continue.git continue
          cd continue
          git checkout 5522c6f44
          git am ../01-continue-improvements.patch
          git am ../02-continue-cli-modes.patch
          git am ../03-continue-fallbacks.patch
          git am ../04-continue-cli-tools.patch
          git am ../05-continue-vscode-activation.patch
          git am ../06-continue-agent-performance.patch
          git am ../07-continue-text-tools.patch
          git am ../08-continue-cli-streaming-vscode.patch
          git status --short

      - name: Build internal packages
        shell: cmd
        run: |
          cd continue
          node scripts\build-packages.js
          cd core
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npm run build
          cd ..\gui
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build
          cd ..\extensions\cli
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build
          cd ..\vscode
          npm ci --no-audit --no-fund --ignore-scripts
          set SKIP_INSTALLS=true
          npm run package -- --target win32-x64

      - name: Locate VSIX
        shell: pwsh
        run: |
          $vsix = Get-ChildItem continue\extensions\vscode\build\*.vsix |
            Where-Object Name -Match "win32-x64" |
            Select-Object -First 1
          if (-not $vsix) { throw "Windows VSIX not found" }
          "VSIX_PATH=$($vsix.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify VSIX contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($env:VSIX_PATH)
          $entries = $zip.Entries.FullName
          $zip.Dispose()
          $required = @(
            "extension/out/extension.js",
            "extension/gui/assets/index.js",
            "extension/out/crypt32-x64.node",
            "extension/bin/napi-v3/win32/x64/onnxruntime_binding.node",
            "extension/out/node_modules/@lancedb/vectordb-win32-x64-msvc/index.node",
            "extension/out/node_modules/node-sqlite3-wasm/dist/node-sqlite3-wasm.wasm"
          )
          foreach ($entry in $required) {
            if (-not ($entries -contains $entry)) { throw "Missing VSIX entry: $entry" }
          }
          if ($entries -match "vectordb-linux-x64-gnu") {
            throw "Linux LanceDB binary leaked into Windows VSIX"
          }
          if ($entries -match "node_sqlite3\.node|sqlite3-binding") {
            throw "Native sqlite3 binding found"
          }

      - name: Windows native binding smoke test
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "continue-vsix-extract"
          Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue
          Expand-Archive -Path $env:VSIX_PATH -DestinationPath $extract -Force
          $root = Join-Path $extract "extension"
          $onnx = Join-Path $root "bin\napi-v3\win32\x64\onnxruntime_binding.node"
          $env:PATH = (Split-Path $onnx) + ";" + $env:PATH
          node -e "require(process.argv[1]); console.log('onnxruntime binding ok')" $onnx
          node -e "require(process.argv[1]); console.log('win-ca crypt32 ok')" (Join-Path $root "out\crypt32-x64.node")
          node -e "require(process.argv[1]); console.log('lancedb ok')" (Join-Path $root "out\node_modules\@lancedb\vectordb-win32-x64-msvc\index.node")

      - name: Install and launch VSIX in VS Code
        shell: pwsh
        run: |
          $code = (Get-Command code -ErrorAction SilentlyContinue).Source
          if (-not $code) { $code = "C:\Program Files\Microsoft VS Code\bin\code.cmd" }
          if (-not (Test-Path $code)) {
            $vscodeZip = Join-Path $env:RUNNER_TEMP "vscode-win32-x64.zip"
            $vscodeDir = Join-Path $env:RUNNER_TEMP "vscode-win32-x64"
            Invoke-WebRequest "https://update.code.visualstudio.com/latest/win32-x64/stable" -OutFile $vscodeZip
            Expand-Archive -Path $vscodeZip -DestinationPath $vscodeDir -Force
            $code = Join-Path $vscodeDir "bin\code.cmd"
          }
          if (-not (Test-Path $code)) { throw "VS Code CLI not found" }

          $userData = Join-Path $env:RUNNER_TEMP "continue-vscode-user"
          $extensions = Join-Path $env:RUNNER_TEMP "continue-vscode-ext"
          Remove-Item -Recurse -Force $userData, $extensions -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $userData, $extensions | Out-Null

          & $code --user-data-dir $userData --extensions-dir $extensions --install-extension $env:VSIX_PATH --force
          if ($LASTEXITCODE -ne 0) { throw "VSIX installation failed" }
          & $code --user-data-dir $userData --extensions-dir $extensions --list-extensions --show-versions
          if ($LASTEXITCODE -ne 0) { throw "VS Code extension listing failed" }

          $launch = Join-Path $env:RUNNER_TEMP "launch-continue-vscode.cmd"
          @"
          @echo off
          "$code" --user-data-dir "$userData" --extensions-dir "$extensions" --disable-workspace-trust --disable-gpu --skip-welcome --skip-release-notes --disable-telemetry --disable-updates "$env:GITHUB_WORKSPACE"
          "@ | Set-Content -Path $launch -Encoding ASCII

          $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "`"$launch`"" -PassThru
          Start-Sleep -Seconds 35
          if (-not $process.HasExited) { taskkill /PID $process.Id /T /F | Out-Null }

      - name: Assert Windows activation succeeded
        shell: pwsh
        run: |
          $userData = Join-Path $env:RUNNER_TEMP "continue-vscode-user"
          $activationError = Join-Path $env:USERPROFILE ".continue\logs\activation-error.log"
          if (Test-Path $activationError) {
            Get-Content $activationError
            throw "Continue wrote an activation error log"
          }

          $logRoot = Join-Path $userData "logs"
          if (-not (Test-Path $logRoot)) { throw "VS Code logs directory was not created" }
          $hits = Get-ChildItem -Recurse -File $logRoot |
            Select-String -Pattern "Continue activation failed", "Error activating the Continue extension"
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Line }
            throw "Continue activation error found in VS Code logs"
          }
          Write-Host "Continue activated without an activation error on Windows."

      - name: Collect VS Code logs
        if: always()
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "vscode-smoke-logs"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $userData = Join-Path $env:RUNNER_TEMP "continue-vscode-user"
          $logRoot = Join-Path $userData "logs"
          if (Test-Path $logRoot) {
            Copy-Item -Recurse -Force $logRoot $dest
          }
          $activationLog = Join-Path $env:USERPROFILE ".continue\logs\activation-error.log"
          if (Test-Path $activationLog) {
            Copy-Item -Force $activationLog $dest
          }

      - name: Upload VSIX and smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continue-windows-vsix
          path: |
            continue/extensions/vscode/build/*.vsix
            vscode-smoke-logs
